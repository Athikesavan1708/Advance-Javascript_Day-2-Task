<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📌Profile Dashboard</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Profile Dashboard</h1>
<br>

    <div class="login">
        <label>Name :</label>
        <input type="text" id="nameInput" placeholder="Enter your name">

        <br>
        <button id="loginBtn">Login</button>

        <h3 id="status">Logged Out</h3>
        <br><br>

        <p id="welcome"></p>
        <br><br>

    </div>
<h2 id="displayName">Your name will appear here</h5>

    <form id="userForm">
        <label>Name </label>
        <input type="text" id="formName" placeholder="Enter your name" required>
        <br>

        <label>Email </label>
        <input type="email" id="formEmail" placeholder="Enter your email" required>
        <br>

        <label>Age </label>
        <input type="number" id="age" placeholder="Enter your age" required>
        <br>

        <br>
        <button type="submit">Submit</button>
    </form>

<p id="formMessage"></p>



</body>
    <script src="sc.js"></script>

</html>
